<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Photo Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📱 iPhone Photo Dashboard</h1>
      <span class="status-badge" id="statusBadge">Laden...</span>
    </header>

    <main class="dashboard-grid">
      <section class="card photo-card">
        <h2>Meest Recente Foto</h2>
        <div class="photo-wrapper">
          <div id="placeholder" class="placeholder">Nog geen foto beschikbaar</div>
          <img id="photoView" class="hidden" alt="iPhone snapshot" />
        </div>
        <div class="action-buttons">
          <button id="btnDevice" class="btn btn-primary">📷 Neem foto op dit apparaat</button>
          <button id="btnPC" class="btn btn-secondary">🖥️ Vraag foto aan vanaf PC</button>
          <button id="btnRefresh" class="btn btn-outline">🔄 Vernieuw</button>
        </div>
        <p id="triggerNote" class="trigger-note hidden">
          🔔 Notificatie verzonden naar iPhone! Tik op de melding om de foto te maken.
        </p>
      </section>

      <section class="card metadata-card">
        <h2>Metadata & Info</h2>
        <div class="meta-item"><span>🕒</span><div><strong>Tijdstip:</strong><p id="metaTime">-</p></div></div>
        <div class="meta-item"><span>🔋</span><div><strong>Batterij:</strong><p id="metaBattery">-</p></div></div>
        <div class="meta-item"><span>📱</span><div><strong>Apparaat:</strong><p id="metaDevice">-</p></div></div>
        <div class="meta-item"><span>📍</span><div><strong>Locatie:</strong><p id="metaLocation">-</p></div></div>
        <div id="map" class="map-container hidden"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
