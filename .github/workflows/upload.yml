name: Process Photo Upload

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Base64 image'
        required: true
      timestamp:
        description: 'Timestamp'
        required: false
      battery:
        description: 'Battery level'
        required: false
      device:
        description: 'Device'
        required: false
      location_name:
        description: 'Location Name'
        required: false
      latitude:
        description: 'Latitude'
        required: false
      longitude:
        description: 'Longitude'
        required: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Opslaan van foto en metadata
        run: |
          mkdir -p data
          echo "${{ inputs.image }}" | base64 -d > data/latest.jpg
          cat << 'EOF' > data/metadata.json
          {
            "hasImage": true,
            "timestamp": "${{ inputs.timestamp }}",
            "battery": "${{ inputs.battery }}",
            "device": "${{ inputs.device }}",
            "location_name": "${{ inputs.location_name }}",
            "latitude": "${{ inputs.latitude }}",
            "longitude": "${{ inputs.longitude }}"
          }
          EOF

      - name: Commit en Push naar GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.jpg data/metadata.json
          git commit -m "Auto-update foto en metadata via Shortcut" || exit 0
          git push
