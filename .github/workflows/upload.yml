name: Process Photo Upload

on:
  repository_dispatch:
    types: [upload_photo]

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Opslaan van foto en metadata
        run: |
          mkdir -p data
          echo "${{ github.event.client_payload.image }}" | base64 -d > data/latest.jpg
          cat << 'EOF' > data/metadata.json
          {
            "hasImage": true,
            "timestamp": "${{ github.event.client_payload.timestamp }}",
            "battery": "${{ github.event.client_payload.battery }}",
            "device": "${{ github.event.client_payload.device }}",
            "location_name": "${{ github.event.client_payload.location_name }}",
            "latitude": "${{ github.event.client_payload.latitude }}",
            "longitude": "${{ github.event.client_payload.longitude }}"
          }
          EOF

      - name: Commit en Push naar GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.jpg data/metadata.json
          git commit -m "Auto-update foto en metadata via Shortcut" || exit 0
          git push
